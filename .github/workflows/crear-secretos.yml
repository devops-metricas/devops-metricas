name: Crear secretos

# Crea notifier-secrets en el namespace de un entorno (DEV-10). Manual y solo desde main.
# La contraseña de PostgreSQL se genera dentro del job y viaja a la VM con az vm run-command: no se
# imprime ni se guarda en GitHub. Si el Secret ya existe no se toca (ver scripts/crear-secretos.sh).
# La identidad sp-notifier-deploy solo acepta tokens de los entornos dev y prod, por eso el job
# declara el entorno elegido; prod exige aprobación.

on:
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno
        type: choice
        required: true
        options: [dev, prod]

permissions:
  contents: read
  id-token: write # OIDC hacia Azure: sin contraseñas guardadas

concurrency:
  group: entrega # comparte cola con Entrega: no se crean secretos a mitad de un despliegue
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-notifier
  VM_NAME: vm-notifier

jobs:
  secretos:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.entorno }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Crear notifier-secrets (${{ inputs.entorno }})
        env:
          ENTORNO: ${{ inputs.entorno }}
        run: ./scripts/crear-secretos.sh "$ENTORNO"
