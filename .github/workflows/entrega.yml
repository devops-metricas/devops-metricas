name: Entrega

# Publicar imagen (en main) -> despliega a dev solo -> espera la aprobación del entorno "prod" -> prod.
# Manual (workflow_dispatch) con un SHA: vuelve a desplegar ese commit, p. ej. para un rollback (DEV-12).
# Se autentica en Azure con OIDC (identidad sp-notifier-deploy: solo "Virtual Machine Contributor") y
# aplica el manifiesto dentro de la VM con `az vm run-command`: la API de Kubernetes no se expone.

on:
  workflow_run:
    workflows: ["Publicar imagen"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: SHA completo (40 caracteres) de un commit de main con imagen publicada
        required: true
      entorno:
        description: Hasta dónde llegar
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write # OIDC hacia Azure: sin contraseñas guardadas

concurrency:
  group: entrega # un despliegue a la vez; uno nuevo espera, no cancela a medias
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-notifier
  VM_NAME: vm-notifier
  # DNS público (lo fija Terraform: etiqueta DNS + región). La región es la de variables.tf.
  FQDN: ${{ vars.TF_DNS_LABEL }}.northcentralus.cloudapp.azure.com
  SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}

jobs:
  dev:
    # Con workflow_run solo si "Publicar imagen" terminó bien; manual solo desde main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 20
    outputs:
      vm_encendida: ${{ steps.vm.outputs.encendida }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # La VM se apaga al terminar cada sesión. Tras un merge automático eso no es un error del
      # código: se omite el despliegue con un aviso. En un despliegue manual (p. ej. rollback) sí falla.
      - name: Comprobar que la VM está encendida
        id: vm
        run: |
          estado=$(az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code,'PowerState/')].code | [0]" -o tsv)
          echo "Estado de la VM: ${estado}"
          if [ "$estado" = "PowerState/running" ]; then
            echo "encendida=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::La VM no está encendida (${estado}). Enciéndela con Infra ops y repite."
            exit 1
          else
            echo "encendida=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VM apagada (${estado}): no se desplegó el commit ${SHA}. Enciende la VM y ejecuta Entrega manualmente con ese SHA."
            {
              echo '### Despliegue omitido: la VM está apagada'
              echo "- Estado: \`${estado}\`"
              echo "- Commit sin desplegar: ${SHA}"
              echo '- Enciende la VM con Infra ops y ejecuta Entrega manualmente con ese SHA.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Desplegar a dev
        if: steps.vm.outputs.encendida == 'true'
        run: ./scripts/desplegar.sh dev "$SHA"
      - name: Resumen
        if: steps.vm.outputs.encendida == 'true'
        run: |
          {
            echo '### Desplegado en dev'
            echo "- Imagen: \`ghcr.io/devops-metricas/notifier:${SHA}\`"
            echo "- Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}"
            echo "- Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

  prod:
    needs: dev
    # El entorno "prod" exige revisores: el job no arranca hasta que alguien aprueba.
    # No arranca si dev se omitió por la VM apagada.
    if: needs.dev.outputs.vm_encendida == 'true' && (github.event_name == 'workflow_run' || inputs.entorno == 'prod')
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Desplegar a prod
        run: ./scripts/desplegar.sh prod "$SHA"
      - name: Resumen
        run: |
          {
            echo '### Desplegado en prod'
            echo "- Imagen: \`ghcr.io/devops-metricas/notifier:${SHA}\`"
            echo "- Commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}"
            echo "- Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
