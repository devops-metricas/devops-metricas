name: Infra ops

# Operación manual de la infraestructura (DEV-13 y DEV-14). Solo se ejecuta desde main.
#   deallocate : apaga la VM (sin cargo de cómputo; el disco y la IP pública siguen cobrando)
#   start      : enciende la VM
#   apply      : crea/actualiza la infraestructura (plan + apply, con aprobación del entorno infra)
#   destroy    : elimina TODA la infraestructura de Terraform (aprobación + confirmación escrita)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Qué hacer con la infraestructura
        type: choice
        required: true
        options: [deallocate, start, apply, destroy]
      confirm:
        description: "Solo para destroy: escribe DESTRUIR"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform # comparte cola con terraform.yml: nunca dos operaciones a la vez
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-notifier
  VM_NAME: vm-notifier
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_dns_label: ${{ vars.TF_DNS_LABEL }}
  TF_VAR_ssh_public_key: ${{ vars.TF_SSH_PUBLIC_KEY }}
  TF_VAR_admin_cidr: ${{ secrets.TF_ADMIN_CIDR }}
  TF_VAR_alert_emails: ${{ secrets.TF_ALERT_EMAILS }}
  TF_VAR_budget_start_date: ${{ vars.TF_BUDGET_START_DATE }}

jobs:
  power:
    # Apagar/encender no pide aprobación: apagar rápido es justo lo que se necesita para ahorrar.
    if: github.ref == 'refs/heads/main' && (inputs.action == 'deallocate' || inputs.action == 'start')
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ${{ inputs.action }} de la VM
        env:
          ACTION: ${{ inputs.action }}
        run: |
          az vm "$ACTION" -g "$RESOURCE_GROUP" -n "$VM_NAME"
          az vm get-instance-view -g "$RESOURCE_GROUP" -n "$VM_NAME" \
            --query "instanceView.statuses[?starts_with(code,'PowerState')].displayStatus | [0]" -o tsv

  terraform:
    if: github.ref == 'refs/heads/main' && (inputs.action == 'apply' || inputs.action == 'destroy')
    runs-on: ubuntu-latest
    environment: infra # exige aprobación antes de arrancar
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      # El checkout va primero: working-directory (infra/terraform) no existe hasta que se clona el repo.
      - uses: actions/checkout@v4
      - name: Confirmación de destroy
        if: inputs.action == 'destroy'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DESTRUIR" ]; then
            echo "Para destruir, escribe exactamente DESTRUIR en el campo confirm." >&2
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
      - name: Init (estado remoto)
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=notifier.tfstate" \
            -backend-config="use_azuread_auth=true"
      - name: Plan y apply
        if: inputs.action == 'apply'
        run: |
          terraform plan -no-color -lock-timeout=120s -out=tfplan
          terraform apply -no-color -lock-timeout=120s tfplan
      - name: Plan y destroy
        if: inputs.action == 'destroy'
        run: |
          terraform plan -destroy -no-color -lock-timeout=120s -out=tfdestroy
          terraform apply -no-color -lock-timeout=120s tfdestroy
