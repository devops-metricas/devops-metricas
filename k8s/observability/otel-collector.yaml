# Colector OpenTelemetry: recibe OTLP de la API y el worker (dev y prod) y reenvía a Jaeger.
# Por qué un colector y no enviar directo a Jaeger: la aplicación solo conoce un endpoint OTLP
# estándar; cambiar de backend (Jaeger, Tempo) o agregar muestreo se hace aquí, sin tocar la imagen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: {endpoint: 0.0.0.0:4318}
          grpc: {endpoint: 0.0.0.0:4317}
    processors:
      # Primero el límite de memoria: si Jaeger no responde, el colector descarta en vez de morir.
      memory_limiter:
        check_interval: 1s
        limit_mib: 180
        spike_limit_mib: 40
      batch:
        timeout: 2s
    exporters:
      otlp/jaeger:
        endpoint: jaeger:4317
        tls: {insecure: true} # tráfico interno del clúster, no sale del nodo
    extensions:
      health_check: {endpoint: 0.0.0.0:13133}
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/jaeger]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: {app: otel-collector}
  ports:
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: {app: otel-collector}
  template:
    metadata:
      labels: {app: otel-collector}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.114.0
          args: [--config=/conf/config.yaml]
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: health, containerPort: 13133}
          volumeMounts:
            - {name: config, mountPath: /conf}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: health}
            initialDelaySeconds: 10
            periodSeconds: 15
          # memory_limiter (180 MiB) queda por debajo del límite para que el colector
          # descarte datos antes de que Kubernetes lo mate por OOM.
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: config
          configMap: {name: otel-collector-config}
