# Identidad de Prometheus. Solo lo necesario para descubrir pods y leer cAdvisor
# a traves del API server. No hay acceso a secretos ni a otros verbos.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels: {app: prometheus}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels: {app: prometheus}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels: {app: prometheus}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  # Namespace explicito: un ClusterRoleBinding no hereda el namespace del manifiesto.
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
