# Grafana sirve bajo /grafana (GF_SERVER_SERVE_FROM_SUB_PATH). La contraseña no va
# en el manifiesto: la inyecta el Secret grafana-admin, creado en la VM como notifier-secrets.
# La raiz no es de solo lectura: Grafana escribe su base en el emptyDir.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-admin, key: password}
            - {name: GF_SERVER_ROOT_URL, value: https://REPLACE_FQDN/grafana/}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: data
          emptyDir: {}
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {app: grafana}
spec:
  type: ClusterIP
  selector: {app: grafana}
  ports:
    - {name: http, port: 80, targetPort: http}
