# Construir con: kustomize build k8s/monitoring --load-restrictor LoadRestrictionsNone
# Hace falta LoadRestrictionsNone porque lee archivos de ../../monitoring
# (un solo origen de verdad para las alertas y el dashboard).
# El Secret grafana-admin no va aqui: lo crea un script dentro de la VM, igual que notifier-secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Aplica a los recursos con namespace. ClusterRole y ClusterRoleBinding se quedan de cluster.
namespace: monitoring
resources:
  - namespace.yaml
  - rbac.yaml
  - prometheus.yaml
  - grafana.yaml
  - ingress.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
      - alerts.yml=../../monitoring/alerts.yml
  - name: grafana-datasources
    files:
      - datasource.yml=grafana-datasource.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=grafana-dashboard-provider.yml
  - name: grafana-dashboards
    files:
      - notifier.json=../../monitoring/grafana/dashboards/notifier.json
