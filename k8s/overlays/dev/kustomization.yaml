apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notifier-dev
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
configMapGenerator:
  - name: notifier-config
    behavior: merge
    literals:
      - NOTIFIER_ENVIRONMENT=dev
# newTag lo escribe el pipeline de entrega (sha del commit); nunca "latest" en dev/prod.
images:
  - name: notifier
    newName: ghcr.io/REPLACE_OWNER/notifier
    newTag: latest
