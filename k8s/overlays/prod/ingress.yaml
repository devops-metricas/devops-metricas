# Exposición pública por HTTPS bajo el prefijo /prod del nombre DNS de la IP pública.
# REPLACE_FQDN lo sustituye el despliegue por <TF_DNS_LABEL>.northcentralus.cloudapp.azure.com
# (nombre que fija Terraform: no cambia al reconstruir). El certificado lo emite Let's Encrypt
# mediante el resolver "letsencrypt" de Traefik (ver k8s/platform/traefik-acme.yaml).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prod
spec:
  stripPrefix:
    prefixes: [/prod] # la API recibe la ruta sin el prefijo: /v1/notifications, no /prod/v1/...
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: notifier-prod-strip-prod@kubernetescrd
spec:
  rules:
    - host: REPLACE_FQDN
      http:
        paths:
          - path: /prod
            pathType: Prefix
            backend:
              service: {name: api, port: {name: http}}
  tls:
    - hosts: [REPLACE_FQDN]
