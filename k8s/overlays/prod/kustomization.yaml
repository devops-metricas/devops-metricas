apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notifier-prod
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
configMapGenerator:
  - name: notifier-config
    behavior: merge
    literals:
      - NOTIFIER_ENVIRONMENT=prod
images:
  - name: notifier
    newName: ghcr.io/kmmelissat/notifier
    newTag: latest
