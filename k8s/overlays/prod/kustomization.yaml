apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: notifier-prod
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
configMapGenerator:
  - name: notifier-config
    behavior: merge
    literals:
      - NOTIFIER_ENVIRONMENT=prod
images:
  # La base ya renombra notifier a esta imagen; aquí solo se cambia la etiqueta.
  - name: ghcr.io/devops-metricas/notifier
    newTag: latest
