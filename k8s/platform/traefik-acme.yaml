# Configura el Traefik que trae K3s para pedir certificados a Let's Encrypt (HTTP-01 por el puerto 80)
# y redirigir HTTP a HTTPS. Se aplica una vez por clúster (no es parte de los overlays dev/prod):
#   kubectl apply -f k8s/platform/traefik-acme.yaml
# Los certificados se guardan en un volumen, así que sobreviven al reinicio de Traefik y de la VM.
#
# Servidor de Let's Encrypt: producción. Para pruebas (sin cuota ni límites) cambiar caserver a
#   https://acme-staging-v02.api.letsencrypt.org/directory   (el certificado no será de confianza).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    additionalArguments:
      - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --entrypoints.web.http.redirections.entrypoint.to=:443
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
    persistence:
      enabled: true
      path: /data
      size: 128Mi
    deployment:
      initContainers:
        # El volumen local nace como root; Traefik corre sin privilegios y necesita escribir acme.json.
        - name: acme-permissions
          image: busybox:1.36
          command: [sh, -c, "chown -R 65532:65532 /data && chmod 700 /data"]
          securityContext: {runAsUser: 0, runAsNonRoot: false}
          volumeMounts:
            - {name: data, mountPath: /data}
